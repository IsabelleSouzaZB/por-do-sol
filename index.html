<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>inicio da pagina❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"rel="stylesheet">
    <link rel="stylesheet" href="inicio.css">
    <link rel="icon" type="image/png" href="imagens/logo 01.png">

</head>


<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-heart">
                🙈
            </div>

            <h1>LaLa & Isa</h1>


            
            <p class="login-subtitle">
                o laranja do por do sol é lindo, quer ver?.
            </p>


            
            <h2>Quem está entrando?</h2>

            <div class="user-options">


                
                <button type="button"class="user-button"id="btn-lala"data-user="lala">
                    💕 LaLa
                </button>


               
                <button type="button"class="user-button"id="btn-isa"data-user="isa">
                    💗 Isa
                </button>


            </div>

            <div class="form-group">

                <label for="senha">
                    senha
                </label>


                <input type="password"id="senha"placeholder="Digite a senha"autocomplete="off">


            </div>

            <button type="button"class="btn-login"id="btn-login">
                Entrar na pagina ❤️
            </button>

            <p class="login-message"id="login-message"aria-live="polite"></p>

                 </div>

            <div class="logo">
                <img src="imagens/laranja.png" alt="lays & isa">
            </div>

        </section>
        

    </main>


<div class="decoracoes-pagina">

    <img src="imagens/1.png" alt="" class="raminho raminho-1">
    <img src="imagens/2.png" alt="" class="raminho raminho-2">
    <img src="imagens/3.png" alt="" class="raminho raminho-3">

    <img src="imagens/1.png" alt="" class="raminho raminho-4">
    <img src="imagens/2.png" alt="" class="raminho raminho-5">
    <img src="imagens/3.png" alt="" class="raminho raminho-6">

    <img src="imagens/1.png" alt="" class="raminho raminho-7">
    <img src="imagens/2.png" alt="" class="raminho raminho-8">
    <img src="imagens/3.png" alt="" class="raminho raminho-9">

</div>


        </section>


    </main>
    <script src="login.js"></script>


</body>

</html>
